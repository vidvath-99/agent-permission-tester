name: Permission tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run secure permission tests
        run: python -u demo.py

      - name: Run API permission tests
        run: python -m unittest -v test_api
      - name: Run API scenario runner tests
        run: python -m unittest -v test_api_runner test_api_runner_cli

      - name: Run API permission scenarios
        run: |
          mkdir -p reports
          python api_runner.py scenarios/api-permissions.json --output reports/api-results.json

      - name: Generate API HTML report
        if: ${{ !cancelled() && hashFiles('reports/api-results.json') != '' }}
        run: python report_html.py reports/api-results.json --output reports/api-results.html

      - name: Run scenario runner tests
        run: python -m unittest -v test_runner

      - name: Run alert evaluator tests
        run: python -m unittest -v test_alert_evaluator

      - name: Run alert CLI tests
        run: python -m unittest -v test_alert_cli

      - name: Run secure JSON scenarios
        run: python runner.py scenarios/permissions.json --broken --report reports/secure-results.json


      - name: Run HTML report tests
        run: python -m unittest -v test_report_html test_report_html_api
        
      - name: Generate API HTML report
        if: ${{ !cancelled() && hashFiles('reports/api-results.json') != '' }}
        run: python report_html.py reports/api-results.json --output reports/api-results.html

      - name: Upload permission reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: permission-reports
          path: |
            reports/secure-results.json
            reports/secure-results.html
            reports/api-results.json
            reports/api-results.html
          if-no-files-found: error
          retention-days: 7
          
      


          
