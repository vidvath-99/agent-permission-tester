name: Permission tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run secure permission tests
        run: python -u demo.py

      - name: Run API permission tests
        run: python -m unittest -v test_api
        
      - name: Run scenario runner tests
        run: python -m unittest -v test_runner

      - name: Run secure JSON scenarios
        run: python runner.py scenarios/permissions.json --report reports/secure-results.json
